name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paroisse_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ${{ github.run_id }}x${{ github.run_attempt }}xCI
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d paroisse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_user:${{ github.run_id }}x${{ github.run_attempt }}xCI@localhost:5432/paroisse_test?schema=public
      JWT_ACCESS_SECRET: security-e2e-only-jwt-secret-not-for-deployment
      TOTP_ENCRYPTION_KEY: security-e2e-only-totp-key-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run test:e2e
      - run: npm run build --if-present
      - run: npm run security:scan
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
