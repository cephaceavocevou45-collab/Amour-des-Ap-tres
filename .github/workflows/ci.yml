name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paroisse_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ${{ github.run_id }}x${{ github.run_attempt }}xCI
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d paroisse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_user:${{ github.run_id }}x${{ github.run_attempt }}xCI@localhost:5432/paroisse_test?schema=public
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - name: Generate ephemeral test secrets
        run: |
          node -e 'const c=require("node:crypto"),f=require("node:fs"),v=[["JWT_ACCESS_SECRET",c.randomBytes(48).toString("base64url")],["TOTP_ENCRYPTION_KEY",c.randomBytes(32).toString("hex")]];f.appendFileSync(process.env.GITHUB_ENV,v.map(([k,x])=>`${k}=${x}`).join("\n")+"\n")'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run test:e2e
      - run: npm run build --if-present
      - run: npm run test:production-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright
      - run: npm run security:scan
      - run: npm run audit:production
      - name: Informational full dependency audit
        if: always()
        run: npm audit --json > npm-audit-full.json || echo "Full audit returned advisories or could not reach the registry; see uploaded report."
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-audit-full-report
          path: npm-audit-full.json
          if-no-files-found: warn
