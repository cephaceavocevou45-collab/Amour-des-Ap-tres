name: amour-des-apotres

services:
  postgres:
    image: postgres:16-alpine
    user: postgres
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in the production environment}
      POSTGRES_APP_DATABASE: ${POSTGRES_APP_DATABASE:?Set POSTGRES_APP_DATABASE in the production environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=8m,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paroisse_app -d \"$${POSTGRES_APP_DATABASE}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2560m
    cpus: 0.60
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: &rotated_logs
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    networks:
      - data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: postgresql://paroisse_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_APP_DATABASE:?Set POSTGRES_APP_DATABASE}?schema=public
      PORT: "3000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the exact public HTTPS origin}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set the public HTTPS URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM:?Set a verified MAIL_FROM address}
      RESEND_DAILY_LIMIT: ${RESEND_DAILY_LIMIT:-100}
      RESEND_ALERT_AT: ${RESEND_ALERT_AT:-80}
      ATTENDANCE_GRACE_MINUTES: ${ATTENDANCE_GRACE_MINUTES:-0}
      DATA_RETENTION_MONTHS: ${DATA_RETENTION_MONTHS:-12}
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-36}
      COMMUNITY_MESSAGE_RETENTION_DAYS: ${COMMUNITY_MESSAGE_RETENTION_DAYS:-365}
      SOCIAL_MEDIA_ENABLED: "false"
      SOCIAL_PHOTOS_ENABLED: "false"
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 2048m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *rotated_logs
    networks:
      data: {}
      edge:
        ipv4_address: 172.30.0.3

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    cpus: 0.10
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *rotated_logs
    networks: [edge]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to the host Let’s Encrypt configuration directory}:/etc/nginx/tls:ro
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8443/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=4m,uid=101,gid=101
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *rotated_logs
    networks:
      edge:
        ipv4_address: 172.30.0.2

  clamav:
    image: clamav/clamav:1.4
    profiles: [media]
    restart: unless-stopped
    user: "100:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/lib/clamav:rw,noexec,nosuid,size=1024m,uid=100,gid=101
      - /var/log/clamav:rw,noexec,nosuid,size=32m,uid=100,gid=101
      - /run/clamav:rw,noexec,nosuid,size=8m,uid=100,gid=101
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
    mem_limit: 2560m
    cpus: 0.30
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *rotated_logs
    networks: [data]

networks:
  data:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
