name: amour-des-apotres

services:
  postgres:
    image: postgres:16-alpine
    user: postgres
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_APP_DATABASE: ${POSTGRES_APP_DATABASE:?Set POSTGRES_APP_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=8m,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paroisse_app -d \"$${POSTGRES_APP_DATABASE}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2560m
    cpus: 0.60
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: &rotated_logs
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    networks: [data]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: postgresql://paroisse_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_APP_DATABASE:?Set POSTGRES_APP_DATABASE}?schema=public
      PORT: "3000"
      HOST: 0.0.0.0
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set the exact public HTTPS origin}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      2FA_REQUIS_RESPONSABLES: ${2FA_REQUIS_RESPONSABLES:-false}
      RESEND_DAILY_LIMIT: ${RESEND_DAILY_LIMIT:-100}
      RESEND_ALERT_AT: ${RESEND_ALERT_AT:-80}
      ATTENDANCE_GRACE_MINUTES: ${ATTENDANCE_GRACE_MINUTES:-0}
      DATA_RETENTION_MONTHS: ${DATA_RETENTION_MONTHS:-12}
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-36}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-30}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 2048m
    cpus: 0.75
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=128m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *rotated_logs
    networks:
      data: {}
      app:
        ipv4_address: 172.31.0.3

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://172.33.0.2:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    cpus: 0.10
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size:16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size:16m,uid:101,gid:101
      - /var/run:rw,noexec,nosuid,size:4m,uid:101,gid:101
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *rotated_logs
    networks:
      app:
        ipv4_address: 172.31.0.2
      tunnel-origin:
        ipv4_address: 172.33.0.2

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    user: "65532:65532"
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?Set CLOUDFLARED_TOKEN}
    depends_on:
      web: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.25
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *rotated_logs
    networks:
      tunnel-origin:
        ipv4_address: 172.33.0.3
      tunnel:
        ipv4_address: 172.32.0.3

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: migrate
    profiles: [maintenance]
    user: node
    command: ["npm", "run", "prisma:deploy", "--workspace", "@paroisse/api"]
    environment:
      NODE_ENV: production
      npm_config_cache: /tmp/npm-cache
      DATABASE_URL: postgresql://paroisse_migrator:${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_APP_DATABASE:?Set POSTGRES_APP_DATABASE}?schema=public
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1536m
    cpus: 0.50
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size:128m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *rotated_logs
    networks: [data]

networks:
  data:
    name: amour-des-apotres_data
    internal: true
  app:
    name: amour-des-apotres_app
    internal: true
    ipam:
      config: [{subnet: 172.31.0.0/24}]
  tunnel:
    name: amour-des-apotres_tunnel
    ipam:
      config: [{subnet: 172.32.0.0/24}]
  tunnel-origin:
    name: amour-des-apotres_tunnel-origin
    internal: true
    ipam:
      config: [{subnet: 172.33.0.0/24}]

volumes:
  postgres_data:
