services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set a 64-character hexadecimal POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paroisse_app -d paroisse"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      parish_net:
        ipv4_address: 172.30.0.4
  api:
    build: {context: .., dockerfile: infra/Dockerfile.api}
    environment:
      DATABASE_URL: postgresql://paroisse_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/paroisse?schema=public
      PORT: 3000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the exact public frontend origin in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set the trusted public app URL in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM on a verified domain in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in .env}
      ATTENDANCE_GRACE_MINUTES: ${ATTENDANCE_GRACE_MINUTES:-0}
      DATA_RETENTION_MONTHS: ${DATA_RETENTION_MONTHS:-12}
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-36}
    depends_on: {postgres: {condition: service_healthy}}
    networks:
      parish_net:
        ipv4_address: 172.30.0.3
  web:
    build: {context: .., dockerfile: infra/Dockerfile.web}
    ports: ["443:8443"]
    volumes:
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to the directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    depends_on: [api]
    networks:
      parish_net:
        ipv4_address: 172.30.0.2
networks:
  parish_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  postgres_data:
