worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  # Railway private DNS; re-resolve changing api.railway.internal addresses periodically.
  resolver [fd12::10] ipv6=on valid=10s;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format privacy '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout privacy;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  limit_req_zone $http_x_real_ip zone=api_rate:10m rate=10r/s;
  limit_req_zone $http_x_real_ip zone=auth_rate:10m rate=2r/s;
  limit_conn_zone $http_x_real_ip zone=api_conn:10m;
  map $http_x_forwarded_for $proxy_chain_depth {
    default 0;
    "~^[^,]+$" 1;
    "~^[^,]+,\\s*[^,]+$" 2;
    "~^[^,]+,\\s*[^,]+,\\s*[^,]+$" 3;
    "~^[^,]+,\\s*[^,]+,\\s*[^,]+,\\s*[^,]+$" 4;
    "~^[^,]+,\\s*[^,]+,\\s*[^,]+,\\s*[^,]+,\\s*[^,]+$" 5;
  }
  include /etc/nginx/conf.d/*.conf;
}
