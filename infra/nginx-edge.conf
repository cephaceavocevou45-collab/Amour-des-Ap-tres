server {
  listen 8080;
  server_name _;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
  location / { return 308 https://$host$request_uri; }
}

server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/tls/live/paroisse/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/live/paroisse/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  client_max_body_size 5m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
  location = /health { access_log off; proxy_pass http://api:3000/health; proxy_set_header Host $host; }
  location = /ready { access_log off; proxy_pass http://api:3000/ready; proxy_set_header Host $host; }
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location / { proxy_pass http://web:8080; proxy_set_header Host $host; }
}
