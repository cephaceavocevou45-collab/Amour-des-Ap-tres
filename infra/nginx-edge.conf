server {
  listen 8080;
  server_name _;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
  location / { return 308 https://$host$request_uri; }
}

server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/tls/live/paroisse/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/live/paroisse/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  client_max_body_size 64k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 10s;
  limit_req_status 429;
  limit_conn_status 429;
  error_page 429 = @rate_limited;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; frame-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
  location = /health { access_log off; proxy_pass http://api:3000/health; proxy_set_header Host $host; }
  location = /ready { access_log off; proxy_pass http://api:3000/ready; proxy_set_header Host $host; }
  location ~ ^/api/v1/auth/(login|admin/login|subadmin/login|password/forgot|password/reset)$ {
    limit_req zone=auth_rate burst=5 nodelay;
    limit_conn api_conn 10;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location /api/ {
    limit_req zone=api_rate burst=60 nodelay;
    limit_conn api_conn 20;
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
  location @rate_limited {
    add_header Retry-After 60 always;
    default_type application/json;
    return 429 '{"statusCode":429,"message":"Trop de tentatives. Réessayez plus tard."}';
  }
  location / { proxy_pass http://web:8080; proxy_set_header Host $host; }
}
